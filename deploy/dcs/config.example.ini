[Historian]
Server=APP
ConnectRetries=3
RetrySeconds=10

[Collector]
Id=DCS-APP-01

[Sampling]
IntervalSeconds=10
MaxFailedTagsPerBatch=5

[Sync]
IntervalMinutes=5
EndDelaySeconds=30
OverlapSeconds=60
MaxWindowMinutes=30
MinWindowSeconds=10

[Files]
Tags=..\config\tags.txt
Logs=..\logs
State=..\state\state.ini

[Batch]
# Normal-window targets; hard limits above remain the final safety boundary.
TargetRows=25000
TargetBytes=10485760
MaxRows=50000
MaxBytes=20971520

[Receiver]
Enabled=true
Url=http://192.168.1.10:8080/api/history/batch
TimeoutSeconds=135
SendRetrySeconds=30
AckMode=database
ApiKey=CHANGE_ME_BEFORE_USE

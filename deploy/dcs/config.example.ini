[Historian]
Server=APP
ConnectRetries=3
RetrySeconds=10

[Collector]
Id=DCS-APP-01

[Sampling]
IntervalSeconds=10
MaxFailedTagsPerBatch=5

[Sync]
IntervalMinutes=5
LookbackMinutes=15
EndDelaySeconds=30
OverlapSeconds=300
MaxWindowMinutes=30
MinWindowSeconds=10

[Files]
Tags=..\config\tags.txt
Spool=..\spool
Logs=..\logs
State=..\state\state.ini

[Spool]
MaxBatchRows=50000
MaxBatchBytes=20971520
MaxPendingBatches=200
MaxPendingBytes=1073741824

[Maintenance]
ArchiveRetentionDays=7
LogRetentionDays=30
MinFreeSpaceMB=2048

[Receiver]
Enabled=true
Url=http://192.168.1.10:8080/api/history/batch
TimeoutSeconds=15
MaxBatchesPerRun=20
AckMode=database
ApiKey=CHANGE_ME_BEFORE_USE

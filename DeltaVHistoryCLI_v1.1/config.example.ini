[Historian]
Server=APP

[Collector]
Id=DCS-APP-01

[Sync]
IntervalMinutes=5
LookbackMinutes=15
EndDelaySeconds=30
MaxSamples=10000

[Files]
Tags=tags.txt
Spool=spool
Logs=logs

[Spool]
MaxBatchRows=50000
MaxBatchBytes=20971520

[Maintenance]
ArchiveRetentionDays=7
LogRetentionDays=30
MinFreeSpaceMB=2048

[Receiver]
Enabled=true
Url=http://RECEIVER_IP:8080/api/history/batch
TimeoutSeconds=15
MaxBatchesPerRun=20
ApiKey=CHANGE_ME_BEFORE_USE

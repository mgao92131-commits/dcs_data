[Historian]
Server=APP
ConnectRetries=3
RetrySeconds=10

[Collector]
Id=DCS-APP-01

[Sync]
IntervalMinutes=5
LookbackMinutes=15
EndDelaySeconds=30
OverlapSeconds=60
MaxWindowMinutes=30
MinWindowSeconds=5
MaxSamples=10000

[Files]
Tags=tags.txt
Spool=spool
Logs=logs
State=state.ini

[Spool]
MaxBatchRows=50000
MaxBatchBytes=20971520
MaxPendingBatches=200
MaxPendingBytes=1073741824

[Maintenance]
ArchiveRetentionDays=7
LogRetentionDays=30
MinFreeSpaceMB=2048

[Receiver]
Enabled=true
Url=http://RECEIVER_IP:8080/api/history/batch
TimeoutSeconds=15
MaxBatchesPerRun=20
AckMode=database
ApiKey=CHANGE_ME_BEFORE_USE
